- name: Upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: full

- name: Install packages
  ansible.builtin.apt:
    name: [nodejs, npm, nginx, certbot, sqlite3, fail2ban, unattended-upgrades, rsync, ufw]
    state: present

- name: Automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Reboot automatically when an update needs it
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-local
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "{{ auto_reboot_time }}";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

- name: Check whether a reboot is pending
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: base_reboot_required

- name: Reboot for kernel / library updates
  ansible.builtin.reboot:
  when: base_reboot_required.stat.exists
