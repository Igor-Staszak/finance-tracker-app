- name: SSH hardening
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh

- name: Firewall defaults
  community.general.ufw:
    direction: "{{ item.direction }}"
    default: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Allow SSH (rate limited)
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp

- name: Allow HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]

- name: Enable firewall
  community.general.ufw:
    state: enabled

- name: Configure fail2ban jails
  ansible.builtin.copy:
    src: jail.local
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban

- name: Start fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Kernel / network hardening
  ansible.builtin.copy:
    src: 99-hardening.conf
    dest: /etc/sysctl.d/99-hardening.conf
    mode: "0644"
  notify: Apply sysctl

- name: Private home directories
  ansible.builtin.file:
    path: "/home/{{ item }}"
    mode: "0700"
  loop: "{{ ssh_allow_users }}"
